[project]
name = "couchbase-lite-tests"
# couchbase SDK only has wheels for < 3.14
requires-python = ">=3.13,<3.14"
version = "0.1.0"
dependencies = [
  "bcrypt==4.2.1",
  "cbltest",
  "click==8.1.8",
  "dotnetenv",
  "paramiko==3.5.0",
  "psutil==7.0.0",
  "pyyaml==6.0.2",
  "tenacity==9.1.4",
  "tqdm==4.67.1",
]

[tool.ruff]
lint.extend-select = ["ANN", "B", "I", "UP"]
lint.ignore = [
  "E402",
  "ANN401",  # `Any` is legitimate for JSON (de)serialization boundaries
  "UP015",   # off: only fires on existing `open(..., "r")` calls, not worth churning
  "UP042",   # off: `(str, Enum)` -> `StrEnum` changes `str()` output on existing enums
  "BLE001",  # TODO: BLE001 (blind-except) - will fix later
  "S110",    # TODO: S110 (try-except-pass) - will fix later
  "PLW1510", # TODO: PLW1510 (subprocess-run-without-check) - will fix later
  "TRY002",  # TODO: TRY002 (raise-vanilla-exception) - will fix later
  "TRY201",  # TODO: TRY201 (verbose-raise) - will fix later
  "TRY004",  # TODO: TRY004 (type-check-without-type-error) - will fix later
  "S112",    # TODO: S112 (try-except-continue) - will fix later
  "B023",    # TODO: B023 (function-uses-loop-loopvar) - will fix later
  "LOG015",  # TODO: LOG015 (root-logger-calls) - will fix later
]
line-length = 120
target-version = "py313"
exclude = [".venv", ".vscode", ".idea", ".github", ".git"]


[tool.uv.sources]
cbltest = { workspace = true }
dotnetenv = { git = "https://github.com/couchbaselabs/couchbase-mobile-tools", subdirectory = "dotnet_testing_env", rev = "c7b7b451c31b1faff91730372ec554f907edcaf9" }

[dependency-groups]
lint = ["ty>=0.0.72", "ruff>=0.16.3", "types-netifaces==0.11.0.20241025"]
# Intentionally empty: the prebuild Jenkinsfile passes --group dotnet-build for every branch, and
# release branches still need this group to pull in dotnetenv, which is a default dependency here.
dotnet-build = []
dev = ["pytest-randomly==5.0.0", "pytest-repeat==0.9.4"]

[tool.uv.workspace]
members = ["client"]

[tool.ty.environment]
root = [".", "client/src", "tests"]

[tool.pytest.ini_options]
# Shuffling the suites this config covers is opt-in via `-p randomly`: they are slow enough that a
# random order is worth asking for. client/tests has its own config and runs shuffled.
addopts = "-p no:randomly"
asyncio_default_fixture_loop_scope = "session"
# "tests" puts tests/shared on the path
pythonpath = ["tests"]
filterwarnings = [
  "ignore:Class property max_ttl is deprecated.*:couchbase.logic.supportability.CouchbaseDeprecationWarning",
]
markers = [
  "upg_sgw: tests that focus on Sync Gateway upgrade scenario",
]
