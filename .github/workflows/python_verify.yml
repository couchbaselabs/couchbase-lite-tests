# Lint, format and type checks live in the pre-commit workflow.
name: Validate Python Files
on:
  push:
    branches:
      - main
    paths:
      - 'client/smoke_tests/**/*.py'
      - 'client/src/**/*.py'
      - 'environment/**/*.py'
      - 'tests/**/*.py'
      - 'jenkins/pipelines/**/*.py'
      - 'scripts/check_topology_markers.py'
      - '**/pyproject.toml'
      - '**/pytest.ini'
      - '.github/workflows/*py*'
  pull_request:
    branches:
      - "**"
    paths:
      - 'client/smoke_tests/**/*.py'
      - 'client/src/**/*.py'
      - 'environment/**/*.py'
      - 'tests/**/*.py'
      - 'jenkins/pipelines/**/*.py'
      - 'scripts/check_topology_markers.py'
      - '.github/workflows/*py*'
jobs:
  client-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Run test
        run: |
          uv run -- pytest --config client/tests/empty_config.json client/tests
